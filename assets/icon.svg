<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#610002" />
      <stop offset="50%" stop-color="#420001" />
      <stop offset="100%" stop-color="#2a0001" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedd9" />
      <stop offset="50%" stop-color="#ff8f80" />
      <stop offset="100%" stop-color="#fbc1b9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle luxury ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Delicate aesthetic floral / eyelash ornament -->
  <path d="M 256 95 C 265 125, 290 145, 320 150 C 290 155, 265 175, 256 205 C 247 175, 222 155, 192 150 C 222 145, 247 125, 256 95 Z" 
        fill="url(#goldGrad)" opacity="0.9" />

  <!-- Monogram D S -->
  <text x="256" y="325" 
        font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
        font-size="160" 
        font-weight="700" 
        font-style="italic"
        letter-spacing="-6"
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#glow)">DS</text>

  <!-- Subtitle Studio & Beauty -->
  <text x="256" y="380" 
        font-family="'Montserrat', 'Inter', sans-serif" 
        font-size="22" 
        font-weight="500" 
        letter-spacing="9" 
        fill="#feebd6" 
        opacity="0.9" 
        text-anchor="middle">STUDIO &amp; BEAUTY</text>
  
  <!-- Tiny bottom star sparkle -->
  <circle cx="256" cy="415" r="4" fill="#ff8f80" />
</svg>
