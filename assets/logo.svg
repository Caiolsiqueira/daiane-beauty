<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#610002" />
      <stop offset="60%" stop-color="#800c0f" />
      <stop offset="100%" stop-color="#610002" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f80" />
      <stop offset="100%" stop-color="#e0695a" />
    </linearGradient>
  </defs>

  <!-- Left Icon Crest -->
  <g transform="translate(10, 10)">
    <circle cx="60" cy="60" r="54" fill="#610002" />
    <circle cx="60" cy="60" r="49" fill="none" stroke="#feebd6" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 3"/>
    <circle cx="60" cy="60" r="45" fill="none" stroke="#ff8f80" stroke-width="2" />
    <text x="60" y="76" 
          font-family="'Playfair Display', 'Georgia', serif" 
          font-size="44" 
          font-weight="700" 
          font-style="italic" 
          fill="#feebd6" 
          text-anchor="middle">DS</text>
  </g>

  <!-- Main Brand Typography -->
  <text x="145" y="68" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
        font-size="42" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="url(#logoGrad)">Daiane Stefani</text>

  <!-- Divider line with coral accent -->
  <line x1="148" y1="84" x2="330" y2="84" stroke="url(#coralGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="340" cy="84" r="3" fill="#610002" />
  <line x1="350" y1="84" x2="520" y2="84" stroke="url(#coralGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Subtitle -->
  <text x="148" y="108" 
        font-family="'Montserrat', 'Inter', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="6.5" 
        fill="#610002" 
        opacity="0.85">STUDIO &amp; BEAUTY</text>
</svg>
